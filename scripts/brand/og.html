<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CanonTracker social image source</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Literata:opsz,wght@7..72,400&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Instrument Sans', sans-serif; }
    /* Graphite and signal orange, from app/assets/main.css. */
    .card { width: 1200px; height: 630px; overflow: hidden; position: relative; background: #f2f3f5; color: #16171a; padding: 56px 64px; }
    .brand { display: flex; align-items: center; gap: 14px; font-size: 32px; font-weight: 600; letter-spacing: -0.6px; }
    .brand svg { width: 44px; height: 44px; color: #16171a; }
    .kicker { margin: 54px 0 16px; color: #c2410c; font-size: 19px; font-weight: 600; }
    h1 { position: relative; z-index: 1; margin: 0; max-width: 620px; font-size: 58px; font-weight: 600; line-height: 1.06; letter-spacing: -2px; }
    .description { font-family: 'Literata', serif; font-size: 22px; line-height: 1.5; color: #4a4d55; max-width: 560px; margin: 26px 0 0; }
    .art { position: absolute; width: 400px; height: 400px; right: 56px; top: 56px; border-radius: 16px; }
    .footer { position: absolute; inset: auto 64px 42px; display: flex; justify-content: space-between; border-top: 1px solid #b9bcc4; padding-top: 19px; font-size: 16px; color: #4a4d55; }
    .dark { background: #111214; color: #ebecef; }
    .dark .brand svg { color: #ebecef; }
    .dark .kicker { color: #ff7a45; }
    .dark .description, .dark .footer { color: #b4b7bf; }
    .dark .footer { border-color: #3e424a; }
    .dark .art { filter: brightness(0.92); }
  </style>
</head>
<body>
  <main class="card" id="card">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <path d="M8 16h16" stroke="currentColor" stroke-width="2"/>
        <circle cx="5" cy="16" r="3" fill="none" stroke="currentColor" stroke-width="2"/>
        <circle cx="27" cy="16" r="3" fill="none" stroke="currentColor" stroke-width="2"/>
        <circle cx="16" cy="16" r="5" fill="#e8501a"/>
      </svg>
      <span>CanonTracker</span>
    </div>
    <p class="kicker" id="kicker"></p>
    <h1 id="headline"></h1>
    <p class="description" id="description"></p>
    <img class="art" id="art" width="400" height="400" alt="">
    <div class="footer"><span>Human-approved · Source-cited · Change impact</span><span>CanonTracker</span></div>
  </main>
  <script>
  // A block, not globals: Playwright's setContent re-writes the same document for each card.
  {
    // One card per variant; render-og.mjs sets data-variant and data-origin (the running app that serves /art).
    const VARIANTS = {
      landing: { dark: false, art: 'conflicts', kicker: 'Source-cited continuity for your story world', headline: 'Catch contradictions.<br>See the sources.', description: 'Every fact cited to its source, every decision made by a person.' },
      default: { dark: true, art: 'story-world', kicker: 'For novelists, game writers, screen writers and worldbuilders', headline: 'Story canon,<br>committed in ink.', description: 'From your documents to canon you can cite, with conflicts and change impact.' },
      agents: { dark: false, art: 'agents', kicker: 'AI agents and MCP', headline: 'AI that proposes.<br>People who decide.', description: 'Extractor, critic, continuity, research, voice and Ask. None of them can change canon.' },
      security: { dark: true, art: 'security', kicker: 'Security and trust', headline: 'A model can’t<br>write your canon.', description: 'Human gate, verbatim citations, project isolation and an append-only audit trail.' },
    }
    const root = document.documentElement.dataset
    const v = VARIANTS[root.variant || new URLSearchParams(location.search).get('variant') || 'landing']
    document.getElementById('card').classList.toggle('dark', v.dark)
    document.getElementById('kicker').textContent = v.kicker
    document.getElementById('headline').innerHTML = v.headline
    document.getElementById('description').textContent = v.description
    document.getElementById('art').src = `${root.origin || 'http://localhost:3000'}/art/${v.art}.webp`
  }
  </script>
</body>
</html>
